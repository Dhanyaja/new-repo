<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="selector">
            <div id="selectField">
                <p id="selectText">Select Social Media</p>
                <img src="images/arrow.png" alt="arrow-image" id="arrowIcon">
            </div>

            <ul id="list" class="hide">
                <li class="options">
                    <img src="images/facebook.png" alt="facebook-logo">
                    <p>Facebook</p>
                </li>
                <li class="options">
                    <img src="images/instagram.png" alt="instagram-logo">
                    <p>Instagram</p>
                </li>
                <li class="options">
                    <img src="images/pinterest.png" alt="pinterest-logo">
                    <p>Pinterest</p>
                </li>
                <li class="options">
                    <img src="images/twitter.png" alt="twitter-logo">
                    <p>Twitter</p>
                </li>
                <li class="options">
                    <img src="images/whatsapp.png" alt="whatsapp-logo">
                    <p>Whatsapp</p>
                </li>
                <li class="options">
                    <img src="images/youtube.png" alt="youtube-logo">
                    <p>Youtube</p>
                </li>
            </ul>
        </div>
    </header>


    <script src="app.js"></script>
</body>
</html>
