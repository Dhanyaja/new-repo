<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="img-container">
        <div class="img active" style="background-image: url(images/rain.avif);"></div>
        <div class="img" style="background-image: url(images/sky.avif);" ></div>
        <div class="img" style="background-image: url(images/lake.avif);" ></div>
        <div class="img" style="background-image: url(images/water.avif);" ></div>
        <div class="img" style="background-image: url(images/forest.avif);" ></div>

        <button class="btn arrow-btn left-arrow"><p>&#x2190</p></button>
        <button class="btn arrow-btn right-arrow"><p>&#x2192</p></button>
    </main>
    <script src="app.js"></script>
</body>
</html>
